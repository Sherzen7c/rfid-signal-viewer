<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>RFID 样本波形查看器</title>
    <style>
:root {
  --canvas: #edf1f2;
  --panel: #ffffff;
  --panel-soft: #f7f9f9;
  --ink: #17262e;
  --muted: #64737a;
  --faint: #8a979c;
  --line: #d6dfe1;
  --line-strong: #bac7ca;
  --accent: #087f83;
  --accent-soft: #dceff0;
  --warning: #b96327;
  --warning-soft: #fff0e4;
  --danger: #aa3c4b;
  --shadow: 0 10px 32px rgba(23, 38, 46, 0.08);
  --tag-1: #087f83;
  --tag-2: #d2762b;
  --tag-3: #b34374;
  --tag-4: #4f8a45;
  --tag-5: #5369a8;
  --tag-6: #9a6a31;
  --body-font: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  --data-font: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font-family: var(--body-font);
  font-size: 14px;
  letter-spacing: 0;
}

button,
input,
select {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
label:focus-within,
input:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(8, 127, 131, 0.22);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-rows: 64px auto 1fr;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 22px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);
}

.brand-block {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-block h1 {
  margin: 0;
  font-size: 17px;
  line-height: 1.2;
  font-weight: 700;
}

.brand-block p {
  margin: 3px 0 0;
  color: var(--muted);
  font-family: var(--data-font);
  font-size: 10px;
  text-transform: uppercase;
}

.brand-trace {
  width: 42px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--panel-soft);
}

.brand-trace span {
  width: 2px;
  border-radius: 1px;
  background: var(--accent);
}

.brand-trace span:nth-child(1),
.brand-trace span:nth-child(5) {
  height: 5px;
}

.brand-trace span:nth-child(2),
.brand-trace span:nth-child(4) {
  height: 13px;
}

.brand-trace span:nth-child(3) {
  height: 22px;
}

.topbar-tools {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
}

.axis-control {
  display: grid;
  grid-template-columns: repeat(2, 68px);
  height: 34px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-soft);
}

.axis-button {
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
}

.axis-button.is-active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 1px 4px rgba(23, 38, 46, 0.12);
  font-weight: 700;
}

.axis-button:disabled {
  color: #9aa7aa;
  cursor: not-allowed;
  opacity: 0.55;
}

.zoom-reset-button {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel-soft);
  color: var(--muted);
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
}

.zoom-reset-button:hover:not(:disabled),
.zoom-reset-button.is-active {
  border-color: rgba(8, 127, 131, 0.45);
  background: var(--panel);
  color: var(--accent);
}

.zoom-reset-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.file-button,
.quiet-button {
  min-height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 13px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.file-button {
  color: #ffffff;
  background: var(--accent);
  border: 1px solid var(--accent);
}

.file-button:hover {
  background: #066d71;
}

.quiet-button {
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
}

.quiet-button:hover:not(:disabled) {
  color: var(--ink);
  border-color: var(--line-strong);
}

.quiet-button:disabled {
  cursor: default;
  opacity: 0.45;
}

.compare-button[aria-pressed="true"] {
  color: #ffffff;
  background: var(--ink);
  border-color: var(--ink);
}

.file-strip {
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: end;
  gap: 4px;
  padding: 0 18px;
  overflow-x: auto;
  background: #e4eaeb;
  border-bottom: 1px solid var(--line-strong);
}

.app-shell[data-state="empty"] .file-strip {
  display: none;
}

.file-tab {
  flex: 0 0 auto;
  min-width: 140px;
  max-width: 260px;
  height: 38px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 28px;
  align-items: center;
  margin-top: 5px;
  color: var(--muted);
  border: 1px solid transparent;
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
}

.file-tab.is-active {
  color: var(--ink);
  background: var(--canvas);
  border-color: var(--line-strong);
}

.file-tab.is-compare-a {
  box-shadow: inset 3px 0 0 #087f83;
}

.file-tab.is-compare-b {
  box-shadow: inset 3px 0 0 #d2762b;
}

.file-tab-select,
.file-tab-close {
  height: 100%;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.file-tab-select {
  min-width: 0;
  overflow: hidden;
  padding: 0 4px 0 12px;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--data-font);
  font-size: 11px;
}

.file-tab-close {
  color: var(--faint);
  font-size: 17px;
  line-height: 1;
}

.file-tab-close:hover {
  color: var(--danger);
}

.workspace {
  min-width: 0;
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr);
}

.app-shell[data-state="empty"] .workspace {
  grid-template-columns: 1fr;
}

.app-shell[data-mode="compare"] .workspace {
  grid-template-columns: 1fr;
}

.sidebar {
  min-width: 0;
  padding: 18px 16px 28px;
  background: #e8edef;
  border-right: 1px solid var(--line-strong);
}

.app-shell[data-state="empty"] .sidebar {
  display: none;
}

.app-shell[data-mode="compare"] .sidebar {
  display: none;
}

.sidebar-section {
  padding: 0 2px 18px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line-strong);
}

.sidebar-section:last-child {
  border-bottom: 0;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.section-heading h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 800;
}

.text-button {
  padding: 2px 0;
  color: var(--accent);
  background: transparent;
  border: 0;
  cursor: pointer;
  font-size: 11px;
}

.metadata-list {
  display: grid;
  gap: 9px;
  margin: 0;
}

.metadata-row {
  min-width: 0;
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
}

.metadata-row dt {
  color: var(--muted);
  font-size: 11px;
}

.metadata-row dd {
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
  font-family: var(--data-font);
  font-size: 11px;
  text-align: right;
}

.tag-list {
  display: grid;
  gap: 7px;
}

.tag-option {
  min-width: 0;
  min-height: 36px;
  display: grid;
  grid-template-columns: 16px 10px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.62);
  cursor: pointer;
}

.tag-option:hover {
  border-color: var(--line-strong);
  background: var(--panel);
}

.tag-option input {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--accent);
}

.tag-swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--tag-color);
}

.tag-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--data-font);
  font-size: 11px;
  font-weight: 700;
}

.tag-count {
  color: var(--muted);
  font-family: var(--data-font);
  font-size: 10px;
}

.parse-messages {
  display: grid;
  gap: 7px;
  color: var(--warning);
  font-size: 11px;
  line-height: 1.45;
}

.main-stage {
  min-width: 0;
  min-height: calc(100vh - 64px);
  padding: 20px;
}

.empty-state {
  min-height: calc(100vh - 104px);
  display: grid;
  place-items: center;
}

.empty-state[hidden],
.viewer[hidden],
.compare-viewer[hidden] {
  display: none;
}

.drop-target {
  width: min(620px, 92vw);
  min-height: 330px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 34px;
  color: var(--ink);
  background: var(--panel);
  border: 1px dashed #9eafb3;
  border-radius: 7px;
  box-shadow: var(--shadow);
  cursor: pointer;
}

.drop-target:hover {
  border-color: var(--accent);
  background: #fbfdfd;
}

.sidebar-drop-section {
  padding-bottom: 0;
  border-bottom: 0;
}

.sidebar-drop-target {
  width: 100%;
  min-height: 64px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  color: var(--ink);
  text-align: left;
  background: rgba(255, 255, 255, 0.58);
  border: 1px dashed #9eafb3;
  border-radius: 5px;
  cursor: pointer;
  transition: border-color 160ms ease, background-color 160ms ease;
}

.sidebar-drop-target:hover,
.sidebar-drop-target:focus-visible {
  border-color: var(--accent);
  background: #f4fbfb;
}

.sidebar-drop-mark {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: var(--accent);
  font-size: 22px;
  line-height: 1;
  border: 1px solid #9ec6c8;
  border-radius: 4px;
}

.sidebar-drop-copy {
  min-width: 0;
}

.sidebar-drop-copy strong,
.sidebar-drop-copy small {
  display: block;
}

.sidebar-drop-copy strong {
  font-size: 13px;
}

.sidebar-drop-copy small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.drop-target strong {
  margin-top: 12px;
  font-size: 21px;
}

.drop-target span:not(.empty-trace) {
  max-width: 440px;
  color: var(--muted);
  line-height: 1.6;
  text-align: center;
}

.drop-target small {
  color: var(--accent);
  font-weight: 700;
}

.empty-trace {
  width: 116px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-bottom: 1px solid var(--line);
}

.empty-trace i {
  display: block;
  width: 4px;
  border-radius: 2px;
  background: var(--accent);
}

.empty-trace i:nth-child(1),
.empty-trace i:nth-child(7) {
  height: 8px;
}

.empty-trace i:nth-child(2),
.empty-trace i:nth-child(6) {
  height: 24px;
}

.empty-trace i:nth-child(3),
.empty-trace i:nth-child(5) {
  height: 42px;
}

.empty-trace i:nth-child(4) {
  height: 58px;
  background: var(--tag-2);
}

.viewer {
  min-width: 0;
  max-width: 1480px;
  margin: 0 auto;
}

.compare-viewer {
  min-width: 0;
  max-width: 1680px;
  margin: 0 auto;
}

.sample-header {
  min-width: 0;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 2px 2px 16px;
}

.sample-title-block {
  min-width: 0;
}

.format-kicker {
  margin-bottom: 5px;
  color: var(--accent);
  font-family: var(--data-font);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.sample-title-block h2 {
  min-width: 0;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--data-font);
  font-size: 19px;
}

.compare-header {
  min-width: 0;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 2px 2px 16px;
}

.compare-controls {
  min-width: 0;
  display: flex;
  align-items: end;
  gap: 12px;
}

.compare-layout-control {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 58px);
  height: 36px;
  padding: 3px;
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 6px;
}

.compare-layout-button {
  border: 0;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
  font-size: 11px;
}

.compare-layout-button.is-active {
  color: var(--ink);
  background: var(--panel);
  box-shadow: 0 1px 4px rgba(23, 38, 46, 0.12);
  font-weight: 700;
}

.compare-selectors {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(190px, 270px) auto minmax(190px, 270px);
  align-items: end;
  gap: 9px;
}

.compare-select {
  min-width: 0;
  display: grid;
  gap: 5px;
}

.compare-select span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
}

.compare-select select {
  min-width: 0;
  height: 36px;
  padding: 0 32px 0 10px;
  overflow: hidden;
  color: var(--ink);
  text-overflow: ellipsis;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  font-family: var(--data-font);
  font-size: 11px;
}

.compare-vs {
  height: 36px;
  display: grid;
  place-items: center;
  color: var(--faint);
  font-family: var(--data-font);
  font-size: 10px;
  font-weight: 800;
}

.compare-line-key {
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 18px;
  padding: 0 2px 9px;
  color: var(--muted);
  font-family: var(--data-font);
  font-size: 10px;
}

.compare-line-key[hidden] {
  display: none;
}

.compare-line-key span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.compare-line-key i {
  width: 34px;
  height: 0;
  border-top: 2px solid var(--ink);
}

.compare-line-key .sample-line-b {
  border-top-color: #9ca8ac;
}

.compare-summary {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.compare-sample {
  min-width: 0;
  padding: 13px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--sample-accent);
  border-radius: 6px;
}

.compare-sample-heading {
  min-width: 0;
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
}

.compare-sample-title {
  min-width: 0;
}

.compare-sample-title strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--data-font);
  font-size: 12px;
}

.compare-sample-title span,
.compare-sample-stats {
  color: var(--muted);
  font-size: 10px;
}

.compare-sample-title span {
  display: block;
  margin-top: 3px;
}

.compare-sample-badge {
  flex: 0 0 auto;
  min-width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  color: #ffffff;
  background: var(--sample-accent);
  border-radius: 4px;
  font-family: var(--data-font);
  font-size: 11px;
  font-weight: 800;
}

.compare-sample-stats {
  margin-top: 8px;
  font-family: var(--data-font);
}

.compare-tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 11px;
}

.compare-tag-option {
  min-width: 0;
  min-height: 29px;
  display: grid;
  grid-template-columns: 14px 8px auto;
  align-items: center;
  gap: 6px;
  padding: 0 8px;
  color: var(--muted);
  background: var(--panel-soft);
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}

.compare-tag-option:has(input:checked) {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--line-strong);
}

.compare-tag-option input {
  width: 13px;
  height: 13px;
  margin: 0;
  accent-color: var(--accent);
}

.compare-tag-option .tag-name {
  max-width: 100px;
  font-size: 10px;
}

.compare-chart-stack {
  min-width: 0;
  display: grid;
  gap: 16px;
}

.compare-metric {
  min-width: 0;
}

.compare-metric-header {
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px 7px;
}

.compare-metric-header h3 {
  margin: 0;
  font-size: 13px;
}

.compare-metric-header span {
  color: var(--muted);
  font-family: var(--data-font);
  font-size: 10px;
}

.compare-metric-actions,
.chart-panel-actions {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
}

.phase-mode-control {
  display: grid;
  grid-template-columns: repeat(2, 44px);
  height: 28px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel-soft);
}

.phase-mode-button {
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 10px;
}

.phase-mode-button.is-active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(23, 38, 46, 0.12);
  font-weight: 700;
}

.compare-chart-grid {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.compare-chart-grid.is-overlay {
  grid-template-columns: minmax(0, 1fr);
}

.compare-chart-grid.is-overlay .chart-frame {
  height: 280px;
}

.compare-chart-grid .chart-panel-header {
  min-height: 39px;
}

.compare-chart-grid .chart-panel-title {
  min-width: 0;
}

.compare-chart-grid .chart-panel-title h3 {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--data-font);
  font-size: 11px;
}

.compare-chart-grid .chart-frame {
  height: 228px;
}

.compare-empty {
  min-height: 220px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
}

.sample-stats {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 20px;
}

.sample-stat {
  min-width: 72px;
  display: grid;
  gap: 3px;
  text-align: right;
}

.sample-stat strong {
  font-family: var(--data-font);
  font-size: 15px;
}

.sample-stat span {
  color: var(--muted);
  font-size: 10px;
}

.chart-stack {
  min-width: 0;
  display: grid;
  gap: 12px;
}

.chart-panel {
  min-width: 0;
  overflow: hidden;

.chart-series.is-sample-b {

  stroke-width: 1;

}

.tooltip-values {

.drop-overlay {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    border-bottom: 1px solid var(--line-strong);

    margin: 0;
    padding: 0;

  }

  .parse-section {
    grid-column: 1 / -1;

  .sidebar-drop-section {
    grid-column: 1 / -1;

  .tag-list {

  .compare-header {

    gap: 12px;

  .compare-controls {
    align-items: stretch;
    flex-direction: column;
  }

  .compare-layout-control {
    align-self: flex-end;
  }

  .compare-selectors {
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  }
}

@media (max-width: 620px) {
  .brand-block h1 {
    font-size: 15px;
  }

  .brand-trace {
    width: 36px;
  }

  .topbar-tools {
    display: flex;
    flex-wrap: wrap;
  }

  .axis-control {

  .file-strip {
    padding: 0 10px;
  }

  .file-tab {

  .sidebar {
    grid-template-columns: 1fr;
  }

  .tag-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sample-header {
    align-items: stretch;
    flex-direction: column;
    gap: 12px;
  }

  .sample-stats {

    grid-template-columns: repeat(3, minmax(0, 1fr));

  }

  .sample-stat {
    min-width: 0;
    padding: 8px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--line);
    border-radius: 5px;
    text-align: left;
  }

  .chart-frame {
    height: 218px;
  }

  .compare-selectors {
    grid-template-columns: 1fr;
  }

  .compare-layout-control {
    align-self: stretch;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .compare-vs {
    display: none;

  .compare-summary,

@media (prefers-reduced-motion: reduce) {

  *::before,

    <script>
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  }
  root.RfidParser = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const SPEED_LABELS = Object.freeze({
    "1": "慢速",
    "2": "正常",
    "3": "快速"
  });

  const GAIT_LABELS = Object.freeze({
    "1": "自然",
    "2": "大步",
    "3": "小步",
    "4": "外八"
  });

  const FORMAT_LABELS = Object.freeze({
    gait: "GaitDatasetCapture",
    dataset: "DatasetCapture",
    hello: "HelloOctaneSdk",
    rfui: "RF-UI data40user"
  });

  const NUMBER_PATTERN = "[-+]?(?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][-+]?\\d+)?";
  const HELLO_PATTERN = new RegExp(
    "^EPC:\\s+(.+?)\\s+antenna:\\s+(\\d+)\\s+first:\\s+(\\d+)" +
      "\\s+last:\\s+(\\d+)\\s+peak_rssi:\\s+(" + NUMBER_PATTERN + ")" +
      "\\s+chan_MHz:\\s+(" + NUMBER_PATTERN + ")" +
      "\\s+phase angle:\\s+(" + NUMBER_PATTERN + ")$"
  );

  function toFiniteNumber(value) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : null;
  }

  function parseColumnLine(line, format) {
    const values = line.trim().split(/\s+/);
    const expectedColumns = format === "dataset" ? 7 : 6;

    if (values.length !== expectedColumns) {
      return { error: "应为 " + expectedColumns + " 列，实际为 " + values.length + " 列" };
    }

    const timestamp = toFiniteNumber(values[2]);
    const df = toFiniteNumber(values[3]);
    const rssi = toFiniteNumber(values[4]);
    const phase = toFiniteNumber(values[5]);

    if (timestamp === null || df === null || rssi === null || phase === null) {
      return { error: "timestamp、DF、RSSI 或 Phase 不是有效数字" };
    }

    return {
      record: {
        sampleId: values[0],
        tagId: values[1],
        epc: null,
        timestamp: timestamp,
        firstTimestamp: null,
        df: df,
        rssi: rssi,
        phase: phase,
        label: format === "dataset" ? values[6] : null,
        antenna: null,
        channel: null
      }
    };
  }

  function parseHelloLine(line) {
    const match = line.trim().match(HELLO_PATTERN);
    if (!match) {
      return { error: "不符合 HelloOctaneSdk 字段格式" };
    }

    const epc = match[1].trim().replace(/\s+/g, " ");
    const antenna = toFiniteNumber(match[2]);
    const firstTimestamp = toFiniteNumber(match[3]);
    const timestamp = toFiniteNumber(match[4]);
    const rssi = toFiniteNumber(match[5]);
    const channel = toFiniteNumber(match[6]);
    const phase = toFiniteNumber(match[7]);

    if ([antenna, firstTimestamp, timestamp, rssi, channel, phase].includes(null)) {
      return { error: "HelloOctaneSdk 行中存在无效数字" };
    }

    const compactEpc = epc.replace(/\s+/g, "");
    return {
      record: {
        sampleId: null,
        tagId: compactEpc.slice(-4),
        epc: epc,
        timestamp: timestamp,
        firstTimestamp: firstTimestamp,
        df: null,
        rssi: rssi,
        phase: phase,
        label: null,
        antenna: antenna,
        channel: channel
      }
    };
  }

  function parseRfuiLine(line) {
    const values = line.trim().split(",").map((value) => value.trim());
    if (values.length !== 5) {
      return { error: "RF-UI CSV 应为 5 列，实际为 " + values.length + " 列" };
    }

    const phase = toFiniteNumber(values[0]);
    const rssi = toFiniteNumber(values[1]);
    const df = toFiniteNumber(values[2]);
    const tag = toFiniteNumber(values[3]);
    const pointIndex = toFiniteNumber(values[4]);

    if ([phase, rssi, df, tag, pointIndex].includes(null)) {
      return { error: "Phase、RSSI、Doppler、Tag ID 或采集序号不是有效数字" };
    }
    if (!Number.isInteger(tag) || !Number.isInteger(pointIndex) || pointIndex < 0) {
      return { error: "Tag ID 和采集序号必须是非负整数" };
    }
    if (tag === 1021) {
      return { ignored: true };
    }
    if (tag < 1001 || tag > 1009) {
      return { error: "RF-UI Tag ID 应位于 1001–1009" };
    }

    return {
      record: {
        sampleId: null,
        tagId: String(tag),
        epc: null,
        timestamp: null,
        firstTimestamp: null,
        df: df,
        rssi: rssi,
        phase: phase,
        label: null,
        antenna: null,
        channel: null,
        pointIndex: pointIndex
      }
    };
  }

  function detectFormat(lines) {
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) {
        continue;
      }
      if (/^EPC:\s+/i.test(trimmed)) {
        return "hello";
      }

      const csvValues = trimmed.split(",").map((value) => value.trim());
      if (
        csvValues.length === 5 &&
        csvValues.every((value) => Number.isFinite(Number(value))) &&
        Number.isInteger(Number(csvValues[3])) &&
        Number.isInteger(Number(csvValues[4]))
      ) {
        return "rfui";
      }

      const values = trimmed.split(/\s+/);
      if (values.length === 6 && values.slice(2).every((value) => Number.isFinite(Number(value)))) {
        return "gait";
      }
      if (
        values.length === 7 &&
        values.slice(2, 6).every((value) => Number.isFinite(Number(value)))
      ) {
        return "dataset";
      }
    }
    return null;
  }

  function parseFilename(fileName, format) {
    const baseName = String(fileName || "未命名文件").replace(/\.[^.]+$/, "");
    const metadata = { baseName: baseName };

    if (format === "gait") {
      const match = baseName.match(/^(\d+)_([1-3])_([1-4])$/);
      if (match) {
        metadata.sampleIndex = match[1];
        metadata.speed = match[2];
        metadata.speedLabel = SPEED_LABELS[match[2]];
        metadata.gait = match[3];
        metadata.gaitLabel = GAIT_LABELS[match[3]];
      }
    } else if (format === "dataset") {
      const match = baseName.match(/^(\d+)_(-?\d+)$/);
      if (match) {
        metadata.sampleIndex = match[1];
        metadata.label = match[2];
      }
    } else if (format === "rfui") {
      const match = baseName.match(/^(.+?)(\d+)$/);
      if (match) {
        metadata.user = match[1];
        metadata.trial = match[2];
      }
    }

    return metadata;
  }

  function uniqueValues(records, field) {
    const values = [];
    const seen = new Set();
    records.forEach((record) => {
      const value = record[field];
      if (value !== null && value !== undefined && !seen.has(value)) {
        seen.add(value);
        values.push(value);
      }
    });
    return values;
  }

  function unwrapPhaseValues(values) {
    const result = [];
    let previousRaw = null;
    let previousUnwrapped = null;

    values.forEach((value) => {
      if (value === null || value === undefined || !Number.isFinite(value)) {
        result.push(null);
        previousRaw = null;
        previousUnwrapped = null;
        return;
      }

      if (previousRaw === null) {
        result.push(value);
        previousRaw = value;
        previousUnwrapped = value;
        return;
      }

      let delta = value - previousRaw;
      while (delta > Math.PI) {
        delta -= 2 * Math.PI;
      }
      while (delta < -Math.PI) {
        delta += 2 * Math.PI;
      }

      previousUnwrapped += delta;
      result.push(previousUnwrapped);
      previousRaw = value;
    });

    return result;
  }

  function parseRfidText(text, fileName) {
    if (typeof text !== "string") {
      throw new TypeError("文件内容必须是文本");
    }

    const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
    const format = detectFormat(lines);
    if (!format) {
      throw new Error("无法识别文件格式，请检查是否来自支持的 RFID 采集程序");
    }

    const records = [];
    const errors = [];
    let invalidLines = 0;
    let ignoredLines = 0;

    lines.forEach((line, index) => {
      if (!line.trim()) {
        return;
      }

      const parsed = format === "hello"
        ? parseHelloLine(line)
        : format === "rfui"
          ? parseRfuiLine(line)
          : parseColumnLine(line, format);
      if (parsed.ignored) {
        ignoredLines += 1;
        return;
      }
      if (parsed.error) {
        invalidLines += 1;
        if (errors.length < 5) {
          errors.push({ line: index + 1, message: parsed.error });
        }
        return;
      }

      parsed.record.sourceLine = index + 1;
      parsed.record.fileIndex = records.length + 1;
      records.push(parsed.record);
    });

    if (!records.length) {
      throw new Error("文件格式已识别，但没有可用于绘图的有效数据行");
    }

    const tagCounters = new Map();
    let timestampMin = null;
    let timestampMax = null;

    if (format === "rfui") {
      records.sort((left, right) => left.pointIndex - right.pointIndex);
      records.forEach((record) => {
        tagCounters.set(record.tagId, (tagCounters.get(record.tagId) || 0) + 1);
        record.elapsedSec = null;
      });
    } else {
      const timestamps = records.map((record) => record.timestamp);
      timestampMin = Math.min.apply(null, timestamps);
      timestampMax = Math.max.apply(null, timestamps);
      records.forEach((record) => {
        const nextPoint = (tagCounters.get(record.tagId) || 0) + 1;
        tagCounters.set(record.tagId, nextPoint);
        record.pointIndex = nextPoint;
        record.elapsedSec = (record.timestamp - timestampMin) / 1000000;
      });
    }

    const pointIndices = records.map((record) => record.pointIndex);
    const pointIndexMin = Math.min.apply(null, pointIndices);
    const pointIndexMax = Math.max.apply(null, pointIndices);

    }
    if (records.some((record) => record.channel !== null)) {
      metrics.push("channel");
    }

    return {
      fileName: fileName || "未命名文件",
      format: format,
      formatLabel: FORMAT_LABELS[format],
      records: records,
      tags: Array.from(tagCounters.keys()),

      invalidLines: invalidLines,
      ignoredLines: ignoredLines,
      errors: errors,
      timestampMin: timestampMin,
      timestampMax: timestampMax,
      durationSec: timestampMin === null ? null : (timestampMax - timestampMin) / 1000000,

      pointIndexMax: pointIndexMax,

      metadata: parseFilename(fileName, format),
      sampleIds: uniqueValues(records, "sampleId"),
      labels: uniqueValues(records, "label"),

    <script>
(function () {

  const state = {
    files: [],
    activeId: null,
    axis: "time",
    phaseMode: "raw",
    zoomDomain: null,
    zoomFrame: null,
    compareMode: false,
    compareIds: [null, null],
    compareLayout: "side-by-side",
    chartContexts: [],

  };

  const refs = {

    tagList: document.getElementById("tagList"),
    toggleAllTags: document.getElementById("toggleAllTags"),
    parseSection: document.getElementById("parseSection"),
    parseMessages: document.getElementById("parseMessages"),
    emptyState: document.getElementById("emptyState"),
    dropTarget: document.getElementById("dropTarget"),

    viewer: document.getElementById("viewer"),
    compareViewer: document.getElementById("compareViewer"),
    compareSelectA: document.getElementById("compareSelectA"),

    sideBySideButton: document.getElementById("sideBySideButton"),

  function sampleById(id) {
    return state.files.find((sample) => sample.id === id) || null;
  }

  function currentSample() {
    return sampleById(state.activeId);
  }

  function comparisonSamples() {
    return state.compareIds.map(sampleById).filter(Boolean);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function svgElement(name, attributes) {
    const element = document.createElementNS(SVG_NS, name);
    Object.entries(attributes || {}).forEach(([key, value]) => {
      element.setAttribute(key, String(value));
    });
    return element;
  }

  function formatValue(value, decimals) {
    if (value === null || value === undefined || !Number.isFinite(value)) {
      return "—";
    }
    return Number(value).toFixed(decimals);
  }

  function formatDuration(value) {
    if (value === null || value === undefined || !Number.isFinite(value)) {
      return "—";
    }
    if (value < 1) {
      return (value * 1000).toFixed(0) + " ms";
    }
    return value.toFixed(value < 10 ? 3 : 2) + " s";
  }

  function compactList(values, formatter) {
    if (!values.length) {
      return null;

    const formatted = values.map((value) => (formatter ? formatter(value) : value));
    if (formatted.length <= 3) {

    return formatted.slice(0, 3).join(", ") + " 等 " + formatted.length + " 项";
  }

  function showToast(message, isError) {

  function buildSample(file, result) {
    const recordsByTag = new Map();
    const tagCounts = new Map();

    result.tags.forEach((tag) => {
      recordsByTag.set(tag, []);
      tagCounts.set(tag, 0);
    });
    result.records.forEach((record) => {
      recordsByTag.get(record.tagId).push(record);
      tagCounts.set(record.tagId, tagCounts.get(record.tagId) + 1);
    });
    recordsByTag.forEach((records) => {
      const unwrapped = parser.unwrapPhaseValues(records.map((record) => record.phase));
      records.forEach((record, index) => {
        record.phaseUnwrapped = unwrapped[index];
      });
    });

    return {
      id: String(Date.now()) + "-" + Math.random().toString(36).slice(2),
      fileName: file.name,
      result: result,
      recordsByTag: recordsByTag,
      tagCounts: tagCounts,
      visibleTags: new Set(result.tags),

  async function loadFiles(fileList) {
    const files = Array.from(fileList || []).filter((file) => file && typeof file.text === "function");
    if (!files.length) {
      return;
    }

    const loaded = [];
    for (const file of files) {
      try {
        const text = await file.text();
        const result = parser.parseRfidText(text, file.name);
        loaded.push(buildSample(file, result));
      } catch (error) {
        showToast(file.name + "：" + error.message, true);
      }
    }

    if (!loaded.length) {
      return;
    }

    state.files.push.apply(state.files, loaded);
    state.activeId = loaded[0].id;
    state.zoomDomain = null;
    refs.fileInput.value = "";
    render();
    showToast("已读取 " + loaded.length + " 个样本", false);
  }

  function ensureComparisonSelection() {
    if (state.files.length < 2) {
      state.compareMode = false;
      state.compareIds = [null, null];
      return false;
    }

    const validIds = new Set(state.files.map((sample) => sample.id));
    let firstId = validIds.has(state.compareIds[0]) ? state.compareIds[0] : state.activeId;
    if (!validIds.has(firstId)) {
      firstId = state.files[0].id;
    }
    let secondId = validIds.has(state.compareIds[1]) && state.compareIds[1] !== firstId
      ? state.compareIds[1]
      : null;
    if (!secondId) {
      const second = state.files.find((sample) => sample.id !== firstId);
      secondId = second ? second.id : null;
    }

    state.compareIds = [firstId, secondId];
    return Boolean(firstId && secondId);
  }

  function setCompareMode(enabled) {
    if (enabled && !ensureComparisonSelection()) {
      return;
    }
    state.compareMode = Boolean(enabled);
    state.zoomDomain = null;
    render();
  }

  function setComparisonLayout(layout) {
    if (layout !== "side-by-side" && layout !== "overlay") {
      return;
    }
    state.compareLayout = layout;
    render();
  }

  function setComparisonSample(index, id) {
    if (!state.compareMode || (index !== 0 && index !== 1) || !sampleById(id)) {
      return;
    }
    const otherIndex = index === 0 ? 1 : 0;
    const previousId = state.compareIds[index];
    if (id === state.compareIds[otherIndex]) {
      state.compareIds[otherIndex] = previousId;
    }
    state.compareIds[index] = id;
    state.activeId = state.compareIds[0];
    state.zoomDomain = null;
    render();
  }

  function removeSample(id) {
    const index = state.files.findIndex((sample) => sample.id === id);
    if (index === -1) {
      return;
    }

    const wasActive = state.activeId === id;
    state.files.splice(index, 1);
    if (wasActive) {
      const fallback = state.files[index] || state.files[index - 1] || null;
      state.activeId = fallback ? fallback.id : null;
    }
    state.zoomDomain = null;
    ensureComparisonSelection();
    render();
  }

  function clearSamples() {

    state.activeId = null;

    state.compareIds = [null, null];

      if (state.compareMode && sample.id === state.compareIds[0]) {
        tab.classList.add("is-compare-a");
      }
      if (state.compareMode && sample.id === state.compareIds[1]) {
        tab.classList.add("is-compare-b");
      }
      tab.setAttribute("role", "presentation");

      const select = document.createElement("button");
      select.type = "button";

        }
        state.activeId = sample.id;
        state.zoomDomain = null;
        render();
      });

      const close = document.createElement("button");

      close.className = "file-tab-close";

      close.title = "关闭 " + sample.fileName;
      close.setAttribute("aria-label", "关闭 " + sample.fileName);
      close.addEventListener("click", () => removeSample(sample.id));

  function addMetadata(label, value) {
    if (value === null || value === undefined || value === "") {
      return;
    }
    const row = document.createElement("div");
    row.className = "metadata-row";
    const term = document.createElement("dt");
    term.textContent = label;
    const description = document.createElement("dd");
    description.textContent = value;
    row.append(term, description);
    refs.metadataList.appendChild(row);
  }

  function renderMetadata(sample) {

    const metadata = result.metadata;
    refs.metadataList.replaceChildren();

    addMetadata("采集格式", result.formatLabel);
    addMetadata(result.format === "rfui" ? "用户代号" : "受试者", metadata.user || compactList(result.sampleIds));
    addMetadata("Trial", metadata.trial);
    addMetadata("样本编号", metadata.sampleIndex);
    if (metadata.speed) {
      addMetadata("速度", metadata.speed + " · " + metadata.speedLabel);
    }
    if (metadata.gait) {
      addMetadata("步态", metadata.gait + " · " + metadata.gaitLabel);
    }
    addMetadata("动作标签", metadata.label || compactList(result.labels));
    addMetadata("天线端口", compactList(result.antennas));
    addMetadata("信道", compactList(result.channels, (value) => Number(value).toFixed(2) + " MHz"));
    if (result.durationSec !== null) {
      addMetadata("时间范围", formatDuration(result.durationSec));
    } else {
      addMetadata("采集序号", result.pointIndexMin + "–" + result.pointIndexMax);
    }
  }

  function renderTags(sample) {
    refs.tagList.replaceChildren();
    sample.result.tags.forEach((tag) => {
      const label = document.createElement("label");
      label.className = "tag-option";
      label.style.setProperty("--tag-color", sample.colorByTag.get(tag));

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = sample.visibleTags.has(tag);
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          sample.visibleTags.add(tag);
        } else {
          sample.visibleTags.delete(tag);
        }
        updateToggleAllLabel(sample);
        window.requestAnimationFrame(() => renderCharts(sample));
      });

      const swatch = document.createElement("span");

      refs.tagList.appendChild(label);

    updateToggleAllLabel(sample);
  }

  function updateToggleAllLabel(sample) {
    refs.toggleAllTags.textContent = sample.visibleTags.size ? "全部隐藏" : "全部显示";

  function renderParseMessages(sample) {

    refs.parseMessages.replaceChildren();
    refs.parseSection.hidden = result.invalidLines === 0 && result.ignoredLines === 0;
    if (!result.invalidLines && !result.ignoredLines) {

    if (result.ignoredLines) {

      refs.parseMessages.appendChild(ignored);

  function renderHeader(sample) {

    refs.sampleStats.replaceChildren();

    const stats = [
      [result.records.length.toLocaleString("zh-CN"), "有效记录"],
      [String(result.tags.length), "RFID 标签"],
      result.durationSec === null

    stats.forEach(([value, label]) => {
      const item = document.createElement("div");

  function populateComparisonSelect(select, selectedId) {
    select.replaceChildren();
    state.files.forEach((sample) => {

      option.textContent = sample.fileName;
      option.selected = sample.id === selectedId;

  }

  function comparisonColorMap(samples) {
    const tags = [];
    const seen = new Set();
    samples.forEach((sample) => {

          tags.push(tag);

  }

  function renderComparisonSummary(samples, colorByTag) {

      const stats = document.createElement("div");
      stats.className = "compare-sample-stats";
      const range = result.durationSec === null
        ? "采集序号 " + result.pointIndexMin + "–" + result.pointIndexMax
        : "时长 " + formatDuration(result.durationSec);
      stats.textContent = result.records.length.toLocaleString("zh-CN") + " 条记录 · " +
        result.tags.length + " 个标签 · " + range;

      const tagList = document.createElement("div");
      tagList.className = "compare-tag-list";
      result.tags.forEach((tag) => {
        const label = document.createElement("label");
        label.className = "compare-tag-option";
        label.style.setProperty("--tag-color", colorByTag.get(tag));

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = sample.visibleTags.has(tag);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            sample.visibleTags.add(tag);
          } else {
            sample.visibleTags.delete(tag);
          }
          window.requestAnimationFrame(renderComparisonCharts);
        });

        const swatch = document.createElement("span");
        swatch.className = "tag-swatch";
        const name = document.createElement("span");
        name.className = "tag-name";
        name.textContent = tag;
        name.title = tag;
        label.append(checkbox, swatch, name);
        tagList.appendChild(label);

      section.append(heading, stats, tagList);
      refs.compareSummary.appendChild(section);

  function renderComparison() {
    const samples = comparisonSamples();
    if (samples.length !== 2) {
      return;
    }
    populateComparisonSelect(refs.compareSelectA, samples[0].id);
    populateComparisonSelect(refs.compareSelectB, samples[1].id);
    const overlayActive = state.compareLayout === "overlay";
    refs.sideBySideButton.classList.toggle("is-active", !overlayActive);
    refs.sideBySideButton.setAttribute("aria-pressed", overlayActive ? "false" : "true");
    refs.overlayButton.classList.toggle("is-active", overlayActive);
    refs.overlayButton.setAttribute("aria-pressed", overlayActive ? "true" : "false");
    refs.compareLineKey.hidden = !overlayActive;
    renderComparisonSummary(samples, comparisonColorMap(samples));
    window.requestAnimationFrame(renderComparisonCharts);
  }

  function render() {
    const sample = currentSample();
    refs.appShell.dataset.state = sample ? "loaded" : "empty";
    refs.appShell.dataset.mode = state.compareMode ? "compare" : "single";
    refs.clearButton.disabled = state.files.length === 0;
    refs.compareButton.disabled = state.files.length < 2;
    refs.compareButton.textContent = state.compareMode ? "退出对比" : "对比样本";
    refs.compareButton.setAttribute("aria-pressed", state.compareMode ? "true" : "false");
    refs.emptyState.hidden = Boolean(sample);
    refs.viewer.hidden = !sample || state.compareMode;

      refs.compareChartStack.replaceChildren();

      refs.tagList.replaceChildren();

    if (state.compareMode) {

      return;

    renderMetadata(sample);
    renderTags(sample);
    renderParseMessages(sample);
    renderHeader(sample);
    window.requestAnimationFrame(() => renderCharts(sample));

  function xValueFor(record) {
    return state.axis === "time" ? record.elapsedSec : record.pointIndex;
  }

  function visibleRecordsFor(sample) {
    return sample.result.records.filter((record) => sample.visibleTags.has(record.tagId));
  }

  function getXDomainForSamples(samples) {
    const records = samples.flatMap(visibleRecordsFor);
    if (!records.length) {
      return [0, 1];
    }
    const values = records.map(xValueFor);
    let min = Math.min.apply(null, values);
    let max = Math.max.apply(null, values);
    if (min === max) {
      max = min + 1;
    }
    if (state.axis === "point") {
      min = Math.min(1, min);
    }
    return [min, max];
  }

  function currentViewSamples() {
    return state.compareMode ? comparisonSamples() : [currentSample()].filter(Boolean);
  }

  function clampZoomDomain(domain, fullDomain) {
    if (!domain) {
      return fullDomain;
    }
    const start = Math.max(fullDomain[0], Math.min(domain[0], domain[1]));
    const end = Math.min(fullDomain[1], Math.max(domain[0], domain[1]));
    return end > start ? [start, end] : fullDomain;
  }

  function getDisplayedXDomainForSamples(samples) {
    const fullDomain = getXDomainForSamples(samples);
    return clampZoomDomain(state.zoomDomain, fullDomain);
  }

  function getXDomain(sample) {
    return getDisplayedXDomainForSamples([sample]);
  }

  function metricValue(record, metric) {
    if (metric === "phase" && state.phaseMode === "unwrapped") {
      return record.phaseUnwrapped;
    }
    return record[metric];
  }

  function metricDisplayLabel(metric) {
    if (metric === "phase" && state.phaseMode === "unwrapped") {
      return "相位（解缠）";
    }
    return METRIC_CONFIG[metric].label;
  }

  function getYDomain(records, metric) {
    const values = records
      .map((record) => metricValue(record, metric))
      .filter((value) => value !== null && Number.isFinite(value));
    if (!values.length) {
      return null;
    }

    let min = Math.min.apply(null, values);
    let max = Math.max.apply(null, values);
    if (min === max) {
      const padding = Math.abs(min) > 0 ? Math.abs(min) * 0.01 : 1;
      min -= padding;
      max += padding;
    } else {
      const padding = (max - min) * 0.08;
      min -= padding;
      max += padding;
    }
    return [min, max];
  }

  function linePath(records, metric, xScale, yScale) {
    const parts = [];
    records.forEach((record) => {
      const value = metricValue(record, metric);
      if (value === null || !Number.isFinite(value)) {
        return;
      }
      parts.push((parts.length ? "L" : "M") + xScale(xValueFor(record)).toFixed(2) + "," + yScale(value).toFixed(2));
    });
    return parts.join(" ");
  }

  function axisLabel(value, axis) {
    if (axis === "time") {
      if (value >= 10) {
        return value.toFixed(1);
      }
      return value.toFixed(2);
    }
    return Math.round(value).toString();
  }

  function createPhaseModeControl() {
    const control = document.createElement("div");
    control.className = "phase-mode-control";
    control.setAttribute("role", "group");
    control.setAttribute("aria-label", "相位显示方式");

    [
      { mode: "raw", label: "原始" },
      { mode: "unwrapped", label: "解缠" }
    ].forEach((item) => {
      const button = document.createElement("button");
      const active = state.phaseMode === item.mode;
      button.type = "button";
      button.className = "phase-mode-button";
      button.textContent = item.label;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
      button.addEventListener("click", () => setPhaseMode(item.mode));
      control.appendChild(button);
    });

    return control;
  }

  function drawMetricChart(sample, metric, xDomain, options) {
    const chartOptions = options || {};
    const chartSamples = chartOptions.samples || [sample];
    const config = METRIC_CONFIG[metric];
    const panel = document.createElement("section");
    panel.className = "chart-panel";

    const panelHeader = document.createElement("header");
    panelHeader.className = "chart-panel-header";
    const titleWrap = document.createElement("div");
    titleWrap.className = "chart-panel-title";
    const title = document.createElement("h3");
    title.textContent = chartOptions.title || config.label;
    title.title = chartOptions.title || "";
    const unit = document.createElement("span");
    unit.textContent = chartOptions.subtitle !== undefined
      ? chartOptions.subtitle
      : metric === "df" && chartSamples.some((chartSample) => chartSample.result.format === "rfui")
        ? "单位未确认"
        : config.unit;
    titleWrap.append(title, unit);
    const rangeLabel = document.createElement("span");
    rangeLabel.className = "chart-range";
    rangeLabel.hidden = Boolean(chartOptions.hideRange);
    const panelActions = document.createElement("div");
    panelActions.className = "chart-panel-actions";
    if (metric === "phase" && !chartOptions.hidePhaseControl) {
      panelActions.appendChild(createPhaseModeControl());
    }
    panelActions.appendChild(rangeLabel);
    panelHeader.append(titleWrap, panelActions);

    const frame = document.createElement("div");
    frame.className = "chart-frame";
    panel.append(panelHeader, frame);
    (chartOptions.container || refs.chartStack).appendChild(panel);

    const visibleRecords = chartSamples.flatMap(visibleRecordsFor);
    const sampleYDomain = getYDomain(visibleRecords, metric);
    const yDomain = chartOptions.yDomain || sampleYDomain;
    if (!sampleYDomain || !yDomain) {
      const empty = document.createElement("div");
      empty.className = "chart-empty";
      empty.textContent = chartSamples.some((chartSample) => chartSample.visibleTags.size)
        ? "当前指标没有有效数据"
        : "至少选择一个标签以显示曲线";
      frame.appendChild(empty);
      return;
    }

    rangeLabel.textContent = formatValue(yDomain[0], config.decimals) + " — " + formatValue(yDomain[1], config.decimals);

    const width = Math.max(frame.clientWidth, 320);
    const height = frame.clientHeight || 242;
    const padding = { top: 14, right: 18, bottom: 34, left: 58 };
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;
    const xScale = (value) => padding.left + ((value - xDomain[0]) / (xDomain[1] - xDomain[0])) * plotWidth;
    const yScale = (value) => padding.top + (1 - (value - yDomain[0]) / (yDomain[1] - yDomain[0])) * plotHeight;
    const svg = svgElement("svg", {
      viewBox: "0 0 " + width + " " + height,
      role: "img",
      "aria-label": metricDisplayLabel(metric) + " 波形图"
    });

    for (let index = 0; index <= 4; index += 1) {
      const value = yDomain[0] + ((yDomain[1] - yDomain[0]) * index) / 4;
      const y = yScale(value);
      svg.appendChild(svgElement("line", {
        x1: padding.left,
        x2: width - padding.right,
        y1: y,
        y2: y,
        class: "chart-grid-line"
      }));
      const label = svgElement("text", {
        x: padding.left - 9,
        y: y + 3,
        "text-anchor": "end",
        class: "chart-axis-label"
      });
      label.textContent = formatValue(value, config.decimals);
      svg.appendChild(label);
    }

    for (let index = 0; index <= 5; index += 1) {
      const value = xDomain[0] + ((xDomain[1] - xDomain[0]) * index) / 5;
      const x = xScale(value);
      svg.appendChild(svgElement("line", {
        x1: x,
        x2: x,
        y1: padding.top,
        y2: height - padding.bottom,
        class: "chart-grid-line"
      }));
      const label = svgElement("text", {
        x: x,
        y: height - 12,
        "text-anchor": index === 0 ? "start" : index === 5 ? "end" : "middle",
        class: "chart-axis-label"
      });
      label.textContent = axisLabel(value, state.axis);
      svg.appendChild(label);
    }

    if (metric === "df" && yDomain[0] < 0 && yDomain[1] > 0) {
      const zeroY = yScale(0);
      svg.appendChild(svgElement("line", {
        x1: padding.left,
        x2: width - padding.right,
        y1: zeroY,
        y2: zeroY,
        class: "chart-zero-line"
      }));
    }

    const seriesSamples = chartSamples.map((chartSample, sampleIndex) => ({
      sample: chartSample,
      sampleIndex: sampleIndex
    }));
    if (chartOptions.overlay) {
      seriesSamples.reverse();
    }

    seriesSamples.forEach((series) => {
      const chartSample = series.sample;
      chartSample.result.tags.forEach((tag) => {
        if (!chartSample.visibleTags.has(tag)) {
          return;
        }
        const pathData = linePath(chartSample.recordsByTag.get(tag), metric, xScale, yScale);
        if (!pathData) {
          return;
        }
        const attributes = {
          d: pathData,
          stroke: chartOptions.colorByTag
            ? chartOptions.colorByTag.get(tag)
            : chartSample.colorByTag.get(tag),
          class: "chart-series" + (chartOptions.overlay
            ? series.sampleIndex === 0 ? " is-sample-a" : " is-sample-b"
            : "")
        };
        svg.appendChild(svgElement("path", attributes));
      });
    });

    const cursor = svgElement("line", {
      x1: padding.left,
      x2: padding.left,
      y1: padding.top,
      y2: height - padding.bottom,
      class: "chart-cursor",
      visibility: "hidden"
    });
    svg.appendChild(cursor);

    const dots = [];
    seriesSamples.forEach((series) => {
      const chartSample = series.sample;
      chartSample.result.tags.forEach((tag) => {
        if (!chartSample.visibleTags.has(tag)) {
          return;
        }
        const dot = svgElement("circle", {
          r: chartOptions.overlay && series.sampleIndex === 1 ? 5 : 4,
          fill: chartOptions.colorByTag
            ? chartOptions.colorByTag.get(tag)
            : chartSample.colorByTag.get(tag),
          class: "chart-hover-dot" + (chartOptions.overlay
            ? series.sampleIndex === 0 ? " is-sample-a" : " is-sample-b"
            : ""),
          visibility: "hidden"
        });
        dots.push({ dot: dot, sample: chartSample, tag: tag });
        svg.appendChild(dot);
      });
    });

    const overlay = svgElement("rect", {
      x: padding.left,
      y: padding.top,
      width: plotWidth,
      height: plotHeight,
      fill: "transparent",
      cursor: "crosshair"
    });
    svg.appendChild(overlay);
    frame.appendChild(svg);

    const context = { samples: chartSamples, metric, svg, cursor, dots, xScale, yScale, xDomain, padding, width, height };
    state.chartContexts.push(context);

    overlay.addEventListener("pointermove", (event) => {
      const rect = svg.getBoundingClientRect();
      const viewX = ((event.clientX - rect.left) / rect.width) * width;
      const boundedX = Math.max(padding.left, Math.min(width - padding.right, viewX));
      const xValue = xDomain[0] + ((boundedX - padding.left) / plotWidth) * (xDomain[1] - xDomain[0]);
      showHover(
        chartSamples,
        xValue,
        event.clientX,
        event.clientY,
        chartOptions.overlay ? metric : null,
        chartOptions.colorByTag
      );
    });
    overlay.addEventListener("wheel", (event) => {
      const deltaMultiplier = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 120 : 1;
      const delta = event.deltaY * deltaMultiplier;
      if (!delta || (delta > 0 && !state.zoomDomain)) {
        return;
      }

      event.preventDefault();
      const rect = svg.getBoundingClientRect();
      const viewX = ((event.clientX - rect.left) / rect.width) * width;
      const boundedX = Math.max(padding.left, Math.min(width - padding.right, viewX));
      const xValue = xDomain[0] +
        ((boundedX - padding.left) / plotWidth) * (xDomain[1] - xDomain[0]);
      const limitedDelta = Math.max(-240, Math.min(240, delta));
      zoomAt(xValue, Math.exp(limitedDelta * 0.0015));
    }, { passive: false });
    overlay.addEventListener("pointerleave", hideHover);
  }

  function renderCharts(sample) {
    if (state.compareMode || !sample || sample.id !== state.activeId) {
      return;
    }
    updateZoomControl();
    refs.chartStack.replaceChildren();
    state.chartContexts = [];
    hideHover();
    const xDomain = getXDomain(sample);
    sample.result.metrics.forEach((metric) => drawMetricChart(sample, metric, xDomain));
  }

  function renderComparisonCharts() {
    if (!state.compareMode) {
      return;
    }
    updateZoomControl();
    const samples = comparisonSamples();
    if (samples.length !== 2) {
      return;
    }

    refs.compareChartStack.replaceChildren();
    state.chartContexts = [];
    hideHover();

    const commonMetrics = samples[0].result.metrics.filter((metric) =>
      samples[1].result.metrics.includes(metric)
    );
    if (!commonMetrics.length) {
      const empty = document.createElement("div");
      empty.className = "compare-empty";
      empty.textContent = "这两个样本没有可共同对比的指标";
      refs.compareChartStack.appendChild(empty);
      return;
    }

    const xDomain = getDisplayedXDomainForSamples(samples);
    const colorByTag = comparisonColorMap(samples);
    const overlayActive = state.compareLayout === "overlay";
    commonMetrics.forEach((metric) => {
      const config = METRIC_CONFIG[metric];
      const yDomain = getYDomain(samples.flatMap(visibleRecordsFor), metric);
      const section = document.createElement("section");
      section.className = "compare-metric";

      const header = document.createElement("header");
      header.className = "compare-metric-header";
      const title = document.createElement("h3");
      title.textContent = metricDisplayLabel(metric);
      const range = document.createElement("span");
      const unit = metric === "df" && samples.some((sample) => sample.result.format === "rfui")
        ? "单位未确认"
        : config.unit;
      range.textContent = yDomain
        ? formatValue(yDomain[0], config.decimals) + " — " +
          formatValue(yDomain[1], config.decimals) + " " + unit
        : "没有可见数据";
      const actions = document.createElement("div");
      actions.className = "compare-metric-actions";
      if (metric === "phase") {
        actions.appendChild(createPhaseModeControl());
      }
      actions.appendChild(range);
      header.append(title, actions);

      const grid = document.createElement("div");
      grid.className = "compare-chart-grid";
      grid.classList.toggle("is-overlay", overlayActive);
      section.append(header, grid);
      refs.compareChartStack.appendChild(section);

      if (overlayActive) {
        drawMetricChart(samples[0], metric, xDomain, {
          container: grid,
          yDomain: yDomain,
          samples: samples,
          colorByTag: colorByTag,
          overlay: true,
          title: "A 与 B 重叠曲线",
          subtitle: "相同标签同色",
          hideRange: true,
          hidePhaseControl: true
        });
      } else {
        samples.forEach((sample, sampleIndex) => {
          drawMetricChart(sample, metric, xDomain, {
            container: grid,
            yDomain: yDomain,
            colorByTag: colorByTag,
            title: (sampleIndex === 0 ? "A · " : "B · ") + sample.fileName,
            subtitle: sample.result.formatLabel,
            hideRange: true,
            hidePhaseControl: true
          });
        });
      }
    });
  }

  function renderVisibleCharts() {
    updateZoomControl();
    if (state.compareMode) {
      renderComparisonCharts();
      return;
    }
    renderCharts(currentSample());
  }

  function scheduleZoomRender() {
    if (state.zoomFrame !== null) {
      window.cancelAnimationFrame(state.zoomFrame);
    }
    state.zoomFrame = window.requestAnimationFrame(() => {
      state.zoomFrame = null;
      renderVisibleCharts();
    });
  }

  function setZoomDomain(domain) {
    const samples = currentViewSamples();
    if (!samples.length) {
      return;
    }
    const fullDomain = getXDomainForSamples(samples);
    const nextDomain = clampZoomDomain(domain, fullDomain);
    const fullSpan = fullDomain[1] - fullDomain[0];
    const nextSpan = nextDomain[1] - nextDomain[0];
    if (fullSpan <= 0 || nextSpan <= 0) {
      return;
    }
    state.zoomDomain = nextSpan >= fullSpan * 0.999 ? null : nextDomain;
    updateZoomControl();
    scheduleZoomRender();
  }

  function zoomAt(xValue, factor) {
    const samples = currentViewSamples();
    const records = samples.flatMap(visibleRecordsFor);
    if (!records.length || !Number.isFinite(xValue) || !Number.isFinite(factor)) {
      return;
    }

    const fullDomain = getXDomainForSamples(samples);
    const currentDomain = getDisplayedXDomainForSamples(samples);
    const fullSpan = fullDomain[1] - fullDomain[0];
    const currentSpan = currentDomain[1] - currentDomain[0];
    const minimumSpan = state.axis === "point"
      ? Math.max(1, fullSpan / 1000)
      : Math.max(0.001, fullSpan / 1000);
    const nextSpan = Math.max(minimumSpan, Math.min(fullSpan, currentSpan * factor));
    const anchor = Math.max(0, Math.min(1, (xValue - currentDomain[0]) / currentSpan));
    let start = xValue - nextSpan * anchor;
    let end = start + nextSpan;

    if (start < fullDomain[0]) {
      end += fullDomain[0] - start;
      start = fullDomain[0];
    }
    if (end > fullDomain[1]) {
      start -= end - fullDomain[1];
      end = fullDomain[1];
    }
    setZoomDomain([start, end]);
  }

  function resetZoom() {
    if (!state.zoomDomain) {
      return;
    }
    state.zoomDomain = null;
    updateZoomControl();
    scheduleZoomRender();
  }

  function updateZoomControl() {
    const hasData = currentViewSamples().flatMap(visibleRecordsFor).length > 0;
    const active = Boolean(state.zoomDomain);
    refs.zoomResetButton.disabled = !hasData || !active;
    refs.zoomResetButton.classList.toggle("is-active", active);
  }

  function nearestRecord(records, target) {
    if (!records || !records.length) {
      return null;
    }
    let low = 0;
    let high = records.length - 1;
    while (low < high) {
      const middle = Math.floor((low + high) / 2);
      if (xValueFor(records[middle]) < target) {
        low = middle + 1;
      } else {
        high = middle;
      }
    }
    const current = records[low];
    const previous = low > 0 ? records[low - 1] : null;
    if (!previous) {
      return current;
    }
    return Math.abs(xValueFor(previous) - target) <= Math.abs(xValueFor(current) - target)
      ? previous
      : current;
  }

  function showHover(samples, xValue, clientX, clientY, focusedMetric, colorByTag) {
    const comparisonActive = samples.length > 1;
    const axisText = state.axis === "time"
      ? "时间 " + xValue.toFixed(3) + " s"
      : "采集点 " + Math.round(xValue);
    const metricLabels = focusedMetric
      ? metricDisplayLabel(focusedMetric)
      : samples[0].result.metrics.map(metricDisplayLabel).join(" · ");
    const rows = [];

    samples.forEach((sample, sampleIndex) => {
      sample.result.tags.forEach((tag) => {
        if (!sample.visibleTags.has(tag)) {
          return;
        }
        const record = nearestRecord(sample.recordsByTag.get(tag), xValue);
        if (!record) {
          return;
        }
        const metrics = focusedMetric ? [focusedMetric] : sample.result.metrics;
        const values = metrics.map((metric) => {
          const config = METRIC_CONFIG[metric];
          return "<span>" + escapeHtml(metricDisplayLabel(metric)) + " " +
            escapeHtml(formatValue(metricValue(record, metric), config.decimals)) + "</span>";
        }).join("");
        const sampleBadge = comparisonActive
          ? "<span class=\"tooltip-sample-badge\" style=\"--sample-color:" +
            (sampleIndex === 0 ? "#087f83" : "#d2762b") + "\">" +
            (sampleIndex === 0 ? "A" : "B") + "</span>"
          : "";
        const color = colorByTag ? colorByTag.get(tag) : sample.colorByTag.get(tag);
        rows.push(
          "<div class=\"tooltip-row" + (comparisonActive ? " is-comparison" : "") + "\">" +
            sampleBadge +
            "<span class=\"tag-swatch\" style=\"--tag-color:" + escapeHtml(color) + "\"></span>" +
            "<strong>" + escapeHtml(tag) + "</strong>" +
            "<span class=\"tooltip-values\">" + values + "</span>" +
          "</div>"
        );
      });
    });

    const heading = comparisonActive
      ? "重叠对比 · " + axisText
      : samples[0].fileName + " · " + axisText;
    refs.chartTooltip.innerHTML =
      "<div class=\"tooltip-heading\"><span>" + escapeHtml(heading) + "</span><span>" +
      escapeHtml(metricLabels) + "</span></div>" + rows.join("");
    refs.chartTooltip.hidden = false;

    state.chartContexts.forEach((context) => {
      const cursorX = context.xScale(xValue);
      context.cursor.setAttribute("x1", cursorX);
      context.cursor.setAttribute("x2", cursorX);
      context.cursor.setAttribute("visibility", "visible");
      context.dots.forEach((entry) => {
        const record = nearestRecord(entry.sample.recordsByTag.get(entry.tag), xValue);
        const value = record ? metricValue(record, context.metric) : null;
        if (value === null || !Number.isFinite(value)) {
          entry.dot.setAttribute("visibility", "hidden");
          return;
        }
        entry.dot.setAttribute("cx", context.xScale(xValueFor(record)));
        entry.dot.setAttribute("cy", context.yScale(value));
        entry.dot.setAttribute("visibility", "visible");
      });
    });

    const tooltipRect = refs.chartTooltip.getBoundingClientRect();
    let left = clientX + 14;
    let top = clientY + 14;
    if (left + tooltipRect.width > window.innerWidth - 10) {
      left = clientX - tooltipRect.width - 14;
    }
    if (top + tooltipRect.height > window.innerHeight - 10) {
      top = clientY - tooltipRect.height - 14;
    }
    refs.chartTooltip.style.left = Math.max(10, left) + "px";
    refs.chartTooltip.style.top = Math.max(10, top) + "px";
  }

  function hideHover() {
    refs.chartTooltip.hidden = true;
    state.chartContexts.forEach((context) => {
      context.cursor.setAttribute("visibility", "hidden");
      context.dots.forEach((entry) => entry.dot.setAttribute("visibility", "hidden"));
    });
  }

  function setAxis(axis) {
    if (axis !== "time" && axis !== "point") {
      return;
    }
    const supportedAxes = supportedAxesForView();
    if (!supportedAxes.includes(axis)) {
      return;
    }
    if (state.axis !== axis) {
      state.axis = axis;
      state.zoomDomain = null;
    }
    updateAxisControl();
    updateZoomControl();
    if (currentSample()) {
      window.requestAnimationFrame(renderVisibleCharts);
    }
  }

  function setPhaseMode(mode) {
    if ((mode !== "raw" && mode !== "unwrapped") || state.phaseMode === mode) {
      return;
    }
    state.phaseMode = mode;
    hideHover();
    window.requestAnimationFrame(renderVisibleCharts);
  }

  function supportedAxesForView() {
    const samples = state.compareMode ? comparisonSamples() : [currentSample()].filter(Boolean);
    if (!samples.length) {
      return ["time", "point"];
    }
    return ["time", "point"].filter((axis) =>
      samples.every((sample) => sample.result.axes.includes(axis))
    );
  }

  function updateAxisControl() {
    const supportedAxes = supportedAxesForView();
    if (!supportedAxes.includes(state.axis)) {
      state.axis = supportedAxes[0];
    }
    document.querySelectorAll(".axis-button").forEach((button) => {
      const supported = supportedAxes.includes(button.dataset.axis);
      const active = button.dataset.axis === state.axis;
      button.disabled = !supported;
      button.title = supported ? "" : "该格式没有时间戳，只能使用采集点横轴";
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }

  refs.fileInput.addEventListener("change", (event) => loadFiles(event.target.files));
  refs.dropTarget.addEventListener("click", () => refs.fileInput.click());
  refs.sidebarDropTarget.addEventListener("click", () => refs.fileInput.click());
  refs.clearButton.addEventListener("click", clearSamples);
  refs.compareButton.addEventListener("click", () => setCompareMode(!state.compareMode));
  refs.compareSelectA.addEventListener("change", (event) => setComparisonSample(0, event.target.value));
  refs.compareSelectB.addEventListener("change", (event) => setComparisonSample(1, event.target.value));
  refs.sideBySideButton.addEventListener("click", () => setComparisonLayout("side-by-side"));
  refs.overlayButton.addEventListener("click", () => setComparisonLayout("overlay"));
  refs.zoomResetButton.addEventListener("click", resetZoom);
  refs.toggleAllTags.addEventListener("click", () => {
    const sample = currentSample();
    if (!sample) {
      return;
    }
    if (sample.visibleTags.size) {
      sample.visibleTags.clear();
    } else {
      sample.result.tags.forEach((tag) => sample.visibleTags.add(tag));
    }
    renderTags(sample);
    window.requestAnimationFrame(() => renderCharts(sample));
  });

  document.querySelectorAll(".axis-button").forEach((button) => {
    button.addEventListener("click", () => setAxis(button.dataset.axis));
  });

  document.addEventListener("dragenter", (event) => {
    if (!event.dataTransfer || !Array.from(event.dataTransfer.types).includes("Files")) {
      return;
    }
    event.preventDefault();
    state.dragDepth += 1;
    refs.dropOverlay.hidden = false;
  });
  document.addEventListener("dragover", (event) => {
    if (event.dataTransfer) {
      event.preventDefault();
      event.dataTransfer.dropEffect = "copy";
    }
  });
  document.addEventListener("dragleave", (event) => {
    event.preventDefault();
    state.dragDepth = Math.max(0, state.dragDepth - 1);
    if (state.dragDepth === 0) {
      refs.dropOverlay.hidden = true;
    }
  });
  document.addEventListener("drop", (event) => {
    event.preventDefault();
    state.dragDepth = 0;
    refs.dropOverlay.hidden = true;
    if (event.dataTransfer) {
      loadFiles(event.dataTransfer.files);
    }
  });

  window.addEventListener("resize", () => {
    window.clearTimeout(state.resizeTimer);
    state.resizeTimer = window.setTimeout(() => {
      if (currentSample()) {
        renderVisibleCharts();
      }
    }, 120);
  });

  render();
})();

    </script>
  </body>
</html>
